[project]
name = "tenq-backend"
version = "0.1.0"
description = "TenQ.ai API: daily AI 10-questions deduction game"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live_ai'"
markers = ["live_ai: calls the real Ollama Cloud API (opt-in, costs quota)"]
