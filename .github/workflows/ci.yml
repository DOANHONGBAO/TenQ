# Continuous integration: lint, type check, unit/integration/security tests with coverage,
# frontend tests and E2E, and a container integration test. No secrets, no deploy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TENQ_TEST_REDIS_URL: redis://127.0.0.1:6390/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - name: Tests with coverage (all)
        run: uv run pytest --cov --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Business logic coverage gate (>= 80%)
        run: >-
          uv run pytest -q --cov=app/models --cov=app/services
          --cov=app/repositories --cov=app/core --cov-fail-under=80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Container integration test (fresh random local secrets, fake words)
        run: COMPOSE="docker compose" infra/scripts/integration.sh
      - name: Validate production compose file
        run: TENQ_RELEASE=ci docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image for linux/arm64 (Oracle Ampere A1)
        run: docker buildx build --platform linux/arm64 --tag tenq-api:arm64-check backend

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Python dependency audit (pip-audit, OSV/PyPI advisories)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - name: npm dependency audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
      - name: No API keys in the frontend bundle
        working-directory: frontend
        run: |
          npm ci && npm run build
          # Server-only names and values must never reach JavaScript served to browsers.
          if grep -rE "TENQ_|OLLAMA_API_KEY|ORIGIN_SECRET|1x0000000000000000000000000000000AA" dist/assets; then
            echo "server-side configuration leaked into the bundle"; exit 1
          fi
