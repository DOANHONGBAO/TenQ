# Redis for TenQ.ai (live game state, leaderboard, caches, rate limits). ADR 0009.
# Reachable only on the internal "data" network; never published on a host port.
bind 0.0.0.0
protected-mode yes
port 6379
# The password comes from REDIS_PASSWORD at start-up (see compose.yaml).

# Persistence: AOF every second (at most ~1 s of writes lost on a crash) plus RDB snapshots
# for faster restarts and simple backups. Files live on the redis-data volume.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
save 900 1
save 300 100
dir /data

# Memory: fail loudly instead of evicting game state (writes return errors -> API 503).
maxmemory 256mb
maxmemory-policy noeviction

# Commands the application never needs.
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

loglevel notice
